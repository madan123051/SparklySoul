<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Admin | SparklySoul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#30281f;--cocoa:#4d3824;--gold:#b68a3d;--cream:#fbf8f3;--sand:#efe7dc;--white:#fffdf9;--line:rgba(77,56,36,.15);--muted:#796a5b;--green:#367255;--red:#a35950;--shadow:0 15px 40px rgba(57,39,21,.1)}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:"DM Sans",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.top{height:72px;background:var(--cocoa);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1230px)/2));gap:20px}.top-brand{display:flex;align-items:center;gap:7px;font:25px "Playfair Display",serif}.top-brand img{width:54px;height:54px;object-fit:contain;mix-blend-mode:multiply}.top-actions{display:flex;gap:18px;align-items:center;font-size:12px}.top-actions a{color:#f2dfc5}.logout{border:1px solid rgba(255,255,255,.45);color:white;background:transparent;padding:8px 11px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.login{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:40px 20px;background:linear-gradient(130deg,#f6ede0,#fbf8f3)}.login-box{width:min(470px,100%);padding:40px;background:#fffdf9;border:1px solid var(--line);box-shadow:var(--shadow)}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}.login h1,h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500;letter-spacing:-.045em}.login h1{font-size:42px;margin:9px 0}.login p{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--cocoa);text-transform:uppercase}.field input,.field select{padding:12px;border:1px solid var(--line);outline:none;background:white}.field input:focus,.field select:focus{border-color:var(--gold)}.button{border:1px solid var(--cocoa);background:var(--cocoa);color:white;padding:13px 17px;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer}.button:hover{background:#271a10}.button.alt{background:transparent;color:var(--cocoa)}.demo-note{margin-top:21px;padding:12px;background:#f2e6d5;color:#654b30;font-size:12px;line-height:1.55}.admin{max-width:1230px;margin:auto;padding:40px 22px 80px}.dashboard-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:31px}.dashboard-head h1{font-size:clamp(36px,5vw,57px);margin:7px 0 0}.dashboard-head p{font-size:13px;color:var(--muted);margin:0 0 7px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:27px}.metric{padding:21px;background:var(--white);border:1px solid var(--line)}.metric span{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.metric strong{display:block;margin-top:8px;color:var(--cocoa);font:35px "Playfair Display",serif;letter-spacing:-.05em}.tabs{display:flex;gap:23px;border-bottom:1px solid var(--line);margin-bottom:28px}.tabs button{padding:0 0 13px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}.tabs button.active{color:var(--cocoa);border-color:var(--gold)}.tab{display:none}.tab.active{display:block}.panel{padding:28px;background:var(--white);border:1px solid var(--line)}.panel h2{font-size:31px;margin:0 0 7px}.panel-intro{margin:0 0 24px;color:var(--muted);font-size:13px;line-height:1.6}.overview-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.quick{padding:25px;background:var(--sand)}.quick h2{font-size:29px;margin:0 0 11px}.quick p{font-size:13px;line-height:1.65;color:var(--muted);max-width:450px}.quick .button{margin-top:5px}.activity{border:1px solid var(--line);padding:25px}.activity h3{font-size:25px;margin:0 0 14px}.activity-row{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.activity-row:last-child{border:0}.activity-row small{display:block;color:var(--muted);margin-top:4px}.product-layout{display:grid;grid-template-columns:320px 1fr;gap:20px}.product-form{padding:21px;background:var(--sand)}.product-form h3{font-size:25px;margin:0 0 19px}.split{display:grid;grid-template-columns:1fr 1fr;gap:11px}.table-wrap{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:540px}th{text-align:left;padding:12px 13px;background:#f7f2ea;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}td{padding:12px 13px;border-top:1px solid var(--line);font-size:12px;vertical-align:middle}td img{width:42px;height:47px;object-fit:cover}.item-cell{display:flex;align-items:center;gap:10px}.item-cell strong{display:block;font-size:12px}.item-cell small{display:block;color:var(--muted);margin-top:3px}.delete{border:0;background:none;color:var(--red);cursor:pointer;font-size:12px}.status{padding:6px 8px;background:#f3e7cf;color:#70531e;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}.status.delivered{background:#dcece2;color:#27613f}.status.shipped{background:#e5edf5;color:#3f5c75}.order-card{padding:18px 0;border-bottom:1px solid var(--line)}.order-card:last-child{border:0}.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.order-top h3{font-family:"DM Sans",sans-serif;letter-spacing:0;font-size:14px;margin:0 0 5px}.order-top p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}.order-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:15px}.order-items{font-size:12px;color:var(--cocoa)}.status-select{padding:9px;border:1px solid var(--line);background:white;font-size:11px;color:var(--cocoa)}.customer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.customer{border:1px solid var(--line);padding:17px}.customer h3{font-family:"DM Sans",sans-serif;letter-spacing:0;font-size:14px;margin:0 0 5px}.customer p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.customer strong{display:block;margin-top:10px;color:var(--cocoa);font-size:11px}.empty{padding:43px;text-align:center;color:var(--muted);line-height:1.7}.toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--cocoa);color:#fffaf0;padding:13px 18px;box-shadow:var(--shadow);font-size:13px;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.top{height:66px;padding:0 16px}.top-actions a:not(:last-child){display:none}.top-brand{font-size:22px}.admin{padding:30px 16px 60px}.dashboard-head{display:block}.metrics{grid-template-columns:repeat(2,1fr)}.overview-grid,.product-layout{grid-template-columns:1fr}.product-form{padding:19px}.customer-grid{grid-template-columns:1fr}.tabs{gap:16px;overflow:auto}.tabs button{white-space:nowrap}.order-top,.order-bottom{display:block}.order-bottom>*{margin-top:11px}.status-select{width:100%}.login-box{padding:30px 22px}}
  </style>
  <style>
    .modal-backdrop{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(36,25,13,.55);backdrop-filter:blur(3px)}
    .modal-backdrop.open{display:flex}.modal{width:min(570px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--white);box-shadow:var(--shadow);padding:29px;position:relative}.modal h2{font-size:31px;margin:0 0 7px}.modal-close{position:absolute;right:15px;top:11px;border:0;background:transparent;color:var(--cocoa);font-size:27px;cursor:pointer}.upload-zone{margin:17px 0;padding:21px;border:1px dashed #ac8c60;background:#f7f0e6;text-align:center;cursor:pointer}.upload-zone input{display:none}.upload-zone strong{display:block;font-size:13px;color:var(--cocoa);margin-bottom:6px}.upload-zone span{display:block;color:var(--muted);font-size:11px;line-height:1.55}.upload-preview{min-height:0;margin-bottom:15px}.upload-preview:empty{display:none}.upload-preview img,.upload-preview video{width:100%;max-height:220px;object-fit:cover;display:block;background:#eadfce}.upload-status{min-height:18px;margin-top:8px;color:var(--muted);font-size:11px}.upload-status.error{color:var(--red)}.upload-status.ready{color:var(--green);font-weight:700}.modal .button:disabled{opacity:.46;cursor:not-allowed}@media(max-width:800px){.modal{padding:24px 18px}}
  </style>
</head>
<body>
  <header class="top"><a class="top-brand" href="index.html"><img src="sparklysoul-logo.jpg" alt="SparklySoul logo">SparklySoul</a><nav class="top-actions"><a href="index.html">View storefront ↗</a><a href="auth.html">Customer account</a><button class="logout" id="logoutBtn" onclick="logout()" style="display:none">Sign out</button></nav></header>
  <main id="app"></main><div class="toast" id="toast"></div>
  <script>
    const $=s=>document.querySelector(s),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
    let products=[],orders=[],uploadedMedia=null,firebaseStoragePromise=null;
    const MAX_MEDIA_BYTES=5*1024*1024;
    const seedProducts=[{id:1,name:'Celeste Pearl Drops',type:'Earrings',price:899,badge:'Bestseller',image:'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=700&q=85'},{id:2,name:'Golden Hour Hoops',type:'Earrings',price:749,badge:'New',image:'https://images.unsplash.com/photo-1635767798638-3665e7d02541?auto=format&fit=crop&w=700&q=85'},{id:3,name:'Luna Stackable Ring',type:'Rings',price:699,badge:'',image:'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=700&q=85'},{id:4,name:'Saanjh Layered Chain',type:'Necklaces',price:1299,badge:'Limited',image:'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=700&q=85'},{id:5,name:'Dewdrop Charm Bracelet',type:'Bracelets',price:799,badge:'',image:'https://images.unsplash.com/photo-1611085583191-a3b181a88401?auto=format&fit=crop&w=700&q=85'},{id:6,name:'Meher Stone Studs',type:'Earrings',price:599,badge:'',image:'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=700&q=85'},{id:7,name:'Noor Pendant',type:'Necklaces',price:1099,badge:'New',image:'https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=700&q=85'},{id:8,name:'Aaina Open Ring',type:'Rings',price:649,badge:'',image:'https://images.unsplash.com/photo-1602173574767-37ac01994b2a?auto=format&fit=crop&w=700&q=85'}];
    function toast(m){let e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>e.classList.remove('show'),2600)}
    function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function hydrate(){const stored=JSON.parse(localStorage.getItem('sparklySoulProducts')||'null');products=stored||seedProducts;if(!stored)localStorage.setItem('sparklySoulProducts',JSON.stringify(seedProducts));orders=JSON.parse(localStorage.getItem('sparklySoulOrders')||'[]')}
    function loginView(){location.replace('auth.html?next=admin')}
    function adminLogin(){location.replace('auth.html?next=admin')}
    async function logout(){try{const tools=await firebaseTools();await tools.signOut(tools.auth)}finally{sessionStorage.removeItem('sparklySoulAdmin');location.replace('auth.html')}}
    function renderAdmin(active='overview'){hydrate();$('#logoutBtn').style.display='block';let revenue=orders.reduce((a,o)=>a+Number(o.total||0),0),customers=new Set(orders.map(o=>o.customer.email)).size;$('#app').innerHTML=`<main class="admin"><div class="dashboard-head"><div><span class="eyebrow">SparklySoul · Delhi</span><h1>Store dashboard</h1></div><p>Manage your jewellery catalogue and customer journey.</p></div><section class="metrics"><div class="metric"><span>Jewellery listed</span><strong>${products.length}</strong></div><div class="metric"><span>Total orders</span><strong>${orders.length}</strong></div><div class="metric"><span>Customers</span><strong>${customers}</strong></div><div class="metric"><span>Order value</span><strong>${money(revenue)}</strong></div></section><div class="tabs"><button class="${active==='overview'?'active':''}" onclick="showTab('overview')">Overview</button><button class="${active==='products'?'active':''}" onclick="showTab('products')">Products & posts</button><button class="${active==='orders'?'active':''}" onclick="showTab('orders')">Orders & delivery</button><button class="${active==='customers'?'active':''}" onclick="showTab('customers')">Customers</button></div><section id="overview" class="tab ${active==='overview'?'active':''}"></section><section id="products" class="tab ${active==='products'?'active':''}"></section><section id="orders" class="tab ${active==='orders'?'active':''}"></section><section id="customers" class="tab ${active==='customers'?'active':''}"></section></main>`;renderOverview();renderProducts();renderOrders();renderCustomers()}
    function showTab(id){document.querySelectorAll('.tab,.tabs button').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');document.querySelector(`.tabs button[onclick="showTab('${id}')"]`).classList.add('active')}
    function renderOverview(){let recent=orders.slice(0,3);$('#overview').innerHTML=`<div class="overview-grid"><section class="quick"><span class="eyebrow">Today’s focus</span><h2>Add your newest sparkle.</h2><p>Use Products & posts to publish a new ring, necklace, earring or bracelet. It will appear automatically on the storefront after refresh.</p><button class="button" onclick="showTab('products');document.querySelector('#productName').focus()">Add jewellery item →</button></section><section class="activity"><h3>Recent order activity</h3>${recent.length?recent.map(o=>`<div class="activity-row"><strong>#${esc(o.id)} · ${esc(o.customer.name)}</strong><small>${esc(o.status)} · ${money(o.total)}</small></div>`).join(''):'<div class="empty">Orders placed by customers will show here.</div>'}</section></div>`}
    function mediaThumb(p){return p.poster||p.image||''}
    function renderProducts(){$('#products').innerHTML=`<section class="panel"><h2>Products & posts</h2><p class="panel-intro">Upload polished product photos and videos directly to Firebase Storage. Images are converted to WebP; videos receive a WebP poster thumbnail.</p><div class="product-layout"><aside class="product-form"><h3>Post a new piece</h3><p class="panel-intro">Photos: JPG, PNG or WebP. Videos: MP4 or WebM. Maximum source size: 5 MB.</p><button class="button" onclick="openProductModal()">Upload product media →</button><p class="panel-intro" style="margin-top:17px">The product is published only after the upload completes.</p></aside><div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Label</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td><div class="item-cell"><img src="${esc(mediaThumb(p))}" alt=""><div><strong>${esc(p.name)}</strong><small>${p.mediaType==='video'?'Video · ':''}ID ${esc(p.id)}</small></div></div></td><td>${esc(p.type)}</td><td>${money(p.price)}</td><td>${esc(p.badge||'—')}</td><td><button class="delete" onclick="deleteProduct(${Number(p.id)})">Remove</button></td></tr>`).join('')}</tbody></table></div></div></section><div class="modal-backdrop" id="productModal" onclick="if(event.target===this)closeProductModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle"><button class="modal-close" onclick="closeProductModal()" aria-label="Close upload form">×</button><span class="eyebrow">Product media</span><h2 id="uploadTitle">Upload & publish</h2><p class="panel-intro">Image files are resized and converted to WebP before upload. Video files stay MP4/WebM because WebP is an image format; a WebP cover image is generated automatically.</p><form onsubmit="addProduct(event)"><div class="field"><label>Jewellery name</label><input id="productName" name="name" required placeholder="e.g. Gulmohar Studs"></div><div class="split"><div class="field"><label>Category</label><select name="type"><option>Earrings</option><option>Rings</option><option>Necklaces</option><option>Bracelets</option></select></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="1" required placeholder="999"></div></div><div class="field"><label>Label (optional)</label><input name="badge" placeholder="New / Bestseller"></div><label class="upload-zone" for="productMediaInput"><input id="productMediaInput" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" onchange="prepareMedia(event)"><strong>Choose a product photo or video</strong><span>Maximum 5 MB · Photos are WebP-compressed · Videos get a WebP poster</span></label><div class="upload-preview" id="uploadPreview"></div><div class="upload-status" id="uploadStatus" aria-live="polite">Choose a media file to enable publishing.</div><button class="button" id="publishProduct" disabled>Publish product →</button></form></section></div>`}
    function openProductModal(){uploadedMedia=null;$('#productModal').classList.add('open')}
    function closeProductModal(){const modal=$('#productModal');if(modal)modal.classList.remove('open')}
    function setUploadStatus(message,kind=''){const status=$('#uploadStatus');status.textContent=message;status.className='upload-status '+kind}
    function showMediaPreview(type,blob){const preview=$('#uploadPreview'),url=URL.createObjectURL(blob);preview.innerHTML=type==='video'?`<video controls muted src="${url}"></video>`:`<img src="${url}" alt="Selected product media">`}
    function canvasToWebp(canvas,quality=.82){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('WebP compression failed.')),'image/webp',quality))}
    async function compressImageToWebp(file){const bitmap=await createImageBitmap(file);let width=bitmap.width,height=bitmap.height,scale=Math.min(1,1600/Math.max(width,height));width=Math.max(1,Math.round(width*scale));height=Math.max(1,Math.round(height*scale));const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(bitmap,0,0,width,height);bitmap.close();for(const quality of [.84,.72,.6]){const blob=await canvasToWebp(canvas,quality);if(blob.size<=MAX_MEDIA_BYTES)return blob}throw new Error('Compressed image is still above 5 MB.')}
    async function createVideoPoster(file){const source=URL.createObjectURL(file),video=document.createElement('video');video.preload='metadata';video.muted=true;video.src=source;try{await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=()=>reject(new Error('Video preview could not be read.'))});video.currentTime=Math.min(1,Math.max(.1,(video.duration||1)/2));await new Promise(resolve=>video.onseeked=resolve);const scale=Math.min(1,1600/Math.max(video.videoWidth,video.videoHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);return await canvasToWebp(canvas,.82)}finally{URL.revokeObjectURL(source)}}
    async function firebaseTools(){if(firebaseStoragePromise)return firebaseStoragePromise;firebaseStoragePromise=(async()=>{const response=await fetch('/api/firebase-config');if(!response.ok)throw new Error('Firebase access is available after Vercel deployment.');const config=await response.json();const [{initializeApp},{getStorage,ref,uploadBytesResumable,getDownloadURL},{getAuth,onAuthStateChanged,signOut}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js'),import('https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js')]);const app=initializeApp(config);return{storage:getStorage(app),ref,uploadBytesResumable,getDownloadURL,auth:getAuth(app),onAuthStateChanged,signOut,config}})();return firebaseStoragePromise}
    function uploadToStorage(tools,path,blob,onProgress){return new Promise((resolve,reject)=>{const task=tools.uploadBytesResumable(tools.ref(tools.storage,path),blob,{contentType:blob.type});task.on('state_changed',snapshot=>onProgress(Math.round(snapshot.bytesTransferred/snapshot.totalBytes*100)),reject,async()=>resolve(await tools.getDownloadURL(task.snapshot.ref)))})}
    async function prepareMedia(event){const file=event.target.files&&event.target.files[0],publish=$('#publishProduct');uploadedMedia=null;publish.disabled=true;if(!file)return;if(file.size>MAX_MEDIA_BYTES){setUploadStatus('Please select a file smaller than 5 MB.','error');event.target.value='';return}const isImage=file.type.startsWith('image/'),isVideo=['video/mp4','video/webm'].includes(file.type);if(!isImage&&!isVideo){setUploadStatus('Use JPG, PNG, WebP, MP4 or WebM only.','error');return}try{setUploadStatus(isImage?'Compressing photo to WebP…':'Creating WebP video poster…');const mediaBlob=isImage?await compressImageToWebp(file):file,posterBlob=isVideo?await createVideoPoster(file):mediaBlob;showMediaPreview(isVideo?'video':'image',isVideo?file:mediaBlob);const tools=await firebaseTools(),stamp=`${Date.now()}-${file.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}`;setUploadStatus('Uploading 0%…');const extension=isImage?'webp':file.type==='video/webm'?'webm':'mp4',mediaUrl=await uploadToStorage(tools,`product-media/${isImage?'images':'videos'}/${stamp}.${extension}`,mediaBlob,percent=>setUploadStatus(`Uploading ${percent}%…`));let posterUrl=mediaUrl;if(isVideo){posterUrl=await uploadToStorage(tools,`product-media/posters/${stamp}.webp`,posterBlob,percent=>setUploadStatus(`Uploading cover ${percent}%…`))}uploadedMedia={type:isVideo?'video':'image',url:mediaUrl,posterUrl};setUploadStatus('Upload complete. Your product is ready to publish.','ready');publish.disabled=false}catch(error){setUploadStatus(error.message||'Upload failed. Check Firebase Storage settings.','error')}}
    function addProduct(e){e.preventDefault();if(!uploadedMedia)return toast('Upload a photo or video first.');let f=new FormData(e.target),p={id:Date.now(),name:f.get('name'),type:f.get('type'),price:Number(f.get('price')),badge:f.get('badge'),image:uploadedMedia.posterUrl,poster:uploadedMedia.posterUrl,media:uploadedMedia.url,mediaType:uploadedMedia.type};products.unshift(p);localStorage.setItem('sparklySoulProducts',JSON.stringify(products));uploadedMedia=null;renderAdmin('products');toast('Product published to storefront')}
    function deleteProduct(id){products=products.filter(p=>Number(p.id)!==id);localStorage.setItem('sparklySoulProducts',JSON.stringify(products));renderAdmin('products');toast('Product removed')}
    function statusClass(s){return s==='Delivered'?'delivered':(s==='Shipped'||s==='Out for Delivery'?'shipped':'')}
    function renderOrders(){$('#orders').innerHTML=`<section class="panel"><h2>Orders & delivery updates</h2><p class="panel-intro">Update each step as you pack and dispatch an order. Customers will see this tracking status in their account.</p>${orders.length?orders.map(o=>`<article class="order-card"><div class="order-top"><div><h3>Order #${esc(o.id)} · ${esc(o.customer.name)}</h3><p>${esc(o.customer.email)} · ${esc(o.customer.phone||'No phone')}<br>${esc(o.customer.address||'Delivery address not saved')}</p></div><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></div><div class="order-bottom"><span class="order-items">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(' · ')}<br><strong>${money(o.total)}</strong> · ${esc(o.payment)}</span><select class="status-select" aria-label="Update order ${esc(o.id)}" onchange="updateStatus('${esc(o.id)}',this.value)"><option ${o.status==='Order Confirmed'?'selected':''}>Order Confirmed</option><option ${o.status==='Packed'?'selected':''}>Packed</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Out for Delivery'?'selected':''}>Out for Delivery</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option></select></div></article>`).join(''):`<div class="empty">No customer orders yet.<br>Orders from the checkout flow will appear here.</div>`}</section>`}
    function updateStatus(id,status){orders=orders.map(o=>o.id===id?{...o,status}:o);localStorage.setItem('sparklySoulOrders',JSON.stringify(orders));renderAdmin('orders');toast('Delivery status updated')}
    function renderCustomers(){let map={};orders.forEach(o=>{if(!map[o.customer.email])map[o.customer.email]={...o.customer,count:0,spent:0};map[o.customer.email].count++;map[o.customer.email].spent+=Number(o.total||0)});let customers=Object.values(map);$('#customers').innerHTML=`<section class="panel"><h2>Customers</h2><p class="panel-intro">Customers appear after their first order. Their details are shown here for fulfilling and supporting orders.</p>${customers.length?`<div class="customer-grid">${customers.map(c=>`<article class="customer"><h3>${esc(c.name)}</h3><p>${esc(c.email)}<br>${esc(c.phone||'No phone')}</p><strong>${c.count} order${c.count>1?'s':''} · ${money(c.spent)}</strong></article>`).join('')}</div>`:`<div class="empty">Customer profiles will appear here after orders are placed.</div>`}</section>`}
    async function bootAdmin(){try{const tools=await firebaseTools();const current=await new Promise(resolve=>{let unsubscribe;unsubscribe=tools.onAuthStateChanged(tools.auth,user=>{if(unsubscribe)unsubscribe();resolve(user)})});if(!current){location.replace('auth.html?next=admin');return}const token=await current.getIdTokenResult(),listed=(tools.config.adminEmails||[]).includes((current.email||'').toLowerCase());if(token.claims.admin!==true&&!listed){await tools.signOut(tools.auth);location.replace('auth.html?next=admin&error=not-admin');return}sessionStorage.setItem('sparklySoulAdmin','yes');renderAdmin()}catch(error){$('#app').innerHTML=`<section class="login"><div class="login-box"><span class="eyebrow">Admin access</span><h1>Sign in required.</h1><p>${esc(error.message||'Firebase login could not be loaded.')}</p><a class="button" href="auth.html?next=admin">Go to shared login →</a></div></section>`}}
    bootAdmin();
  </script>
</body>
</html>

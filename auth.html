<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | SparklySoul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#30281f;--cocoa:#4d3824;--gold:#b68a3d;--cream:#fbf8f3;--sand:#efe7dc;--white:#fffdf9;--line:rgba(77,56,36,.15);--muted:#796a5b;--red:#a35950;--green:#367255;--shadow:0 18px 52px rgba(57,39,21,.13)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(126deg,#f3e4d1,#fbf8f3 52%,#eaddca);color:var(--ink);font-family:"DM Sans",sans-serif}.bar{height:71px;padding:0 max(18px,calc((100vw - 1130px)/2));display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:7px;font:25px "Playfair Display",serif;color:var(--cocoa);letter-spacing:-.05em}.brand img{width:51px;height:51px;object-fit:contain;mix-blend-mode:multiply}.back{font-size:12px;font-weight:700;color:var(--cocoa)}.page{min-height:calc(100dvh - 71px);display:grid;place-items:center;padding:36px 17px 72px}.auth-card{width:min(495px,100%);background:var(--white);padding:40px;border:1px solid var(--line);box-shadow:var(--shadow)}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}h1{font:500 clamp(35px,6vw,48px)/1.05 "Playfair Display",serif;letter-spacing:-.055em;margin:8px 0 11px}.intro{margin:0 0 25px;color:var(--muted);font-size:14px;line-height:1.6}.google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:1px solid var(--line);background:white;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}.google:hover{border-color:var(--gold)}.google-icon{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(from -45deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0);color:white;font:700 12px Arial}.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#a69889;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--cocoa)}.field input{padding:13px;border:1px solid var(--line);outline:none;background:white;color:var(--ink)}.field input:focus{border-color:var(--gold)}.submit{width:100%;padding:14px;border:1px solid var(--cocoa);background:var(--cocoa);color:white;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.submit:disabled,.google:disabled{opacity:.55;cursor:not-allowed}.message{min-height:20px;margin:16px 0 0;text-align:center;font-size:12px;line-height:1.5;color:var(--muted)}.message.error{color:var(--red)}.message.success{color:var(--green)}@media(max-width:520px){.auth-card{padding:29px 22px}.bar{height:65px}.page{min-height:calc(100dvh - 65px);padding-top:20px}.brand{font-size:22px}}
  </style>
</head>
<body>
  <header class="bar"><a href="index.html" class="brand"><img src="sparklysoul-logo-transparent.png" alt="SparklySoul logo">SparklySoul</a><a class="back" href="index.html">← Back to store</a></header>
  <main class="page"><section class="auth-card"><span class="eyebrow">Sign in</span><h1>Your sparkle space.</h1><p class="intro">Sign in to save your profile, follow orders and checkout more easily.</p><button class="google" id="googleButton" type="button"><span class="google-icon">G</span> Continue with Google</button><div class="divider">or</div><form id="emailForm"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@email.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Minimum 6 characters"></div><button class="submit" id="emailSubmit">Sign in with email →</button></form><div class="message" id="message" aria-live="polite"></div></section></main>
  <script type="module">
    const $=s=>document.querySelector(s);
    let auth,authApi,config;
    const message=(text,kind='')=>{const e=$('#message');e.textContent=text;e.className='message '+kind};
    const busy=(on)=>{$('#googleButton').disabled=on;$('#emailSubmit').disabled=on};
    async function loadFirebase(){const response=await fetch('/api/firebase-config');if(!response.ok)throw new Error('Login is available on the deployed Vercel site.');config=await response.json();const [{initializeApp},{getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signOut}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js')]);const app=initializeApp(config);auth=getAuth(app);authApi={GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signOut}}
    async function isAdmin(user){const token=await user.getIdTokenResult();const listed=(config.adminEmails||[]).includes((user.email||'').toLowerCase());return token.claims.admin===true||listed}
    async function googleSignIn(){try{busy(true);const provider=new authApi.GoogleAuthProvider();const result=await authApi.signInWithPopup(auth,provider);location.replace('account.html')}catch(error){message(error.code==='auth/popup-closed-by-user'?'Google sign-in was cancelled.':(error.message||'Google sign-in failed.'),'error')}finally{busy(false)}}
    async function emailSignIn(event){event.preventDefault();try{busy(true);const email=$('#email').value.trim(),password=$('#password').value,user=(await authApi.signInWithEmailAndPassword(auth,email,password)).user;if(await isAdmin(user)){location.replace('admin.html');return}await authApi.signOut(auth);message('This email is not authorised for store access.','error')}catch(error){message(error.code==='auth/invalid-credential'?'Email or password is incorrect.':(error.message||'Email sign-in failed.'),'error')}finally{busy(false)}}
    async function boot(){try{await loadFirebase();$('#googleButton').onclick=googleSignIn;$('#emailForm').onsubmit=emailSignIn}catch(error){message(error.message||'Authentication could not be loaded.','error');busy(true)}}
    boot();
  </script>
</body>
</html>

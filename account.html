<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | SparklySoul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#30281f;--cocoa:#4d3824;--gold:#b68a3d;--cream:#fbf8f3;--sand:#efe7dc;--white:#fffdf9;--line:rgba(77,56,36,.14);--muted:#796a5b;--green:#3e785b;--shadow:0 14px 40px rgba(73,51,28,.1)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.announcement{padding:9px 16px;background:var(--cocoa);color:#fff8eb;text-align:center;font-size:11px;letter-spacing:.12em}.nav{height:74px;max-width:1180px;margin:auto;padding:0 25px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:6px}.brand img{width:52px;height:52px;object-fit:contain;mix-blend-mode:multiply}.brand span{font:24px/1 "Playfair Display",serif;color:var(--cocoa);letter-spacing:-.06em}.nav-links{display:flex;gap:23px;align-items:center;font-size:12px;font-weight:700}.nav-links a:last-child{padding:10px 15px;border:1px solid var(--cocoa)}.page{max-width:1120px;margin:0 auto;padding:55px 25px 85px}.eyebrow{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500;letter-spacing:-.045em}h1{font-size:clamp(38px,5vw,60px);margin:8px 0 34px}.login-wrap{max-width:520px;margin:30px auto 0;background:var(--white);padding:43px;border:1px solid var(--line);box-shadow:var(--shadow)}.login-wrap h2{margin:8px 0 9px;font-size:34px}.login-wrap p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 25px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px;margin-bottom:16px}.field.full{grid-column:span 2}.field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cocoa)}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid var(--line);outline:none;background:#fffdf9;color:var(--ink)}.field textarea{min-height:76px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 19px;border:1px solid var(--cocoa);background:var(--cocoa);color:white;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.2s}.button:hover{background:#281b10;transform:translateY(-1px)}.button.outline{background:transparent;color:var(--cocoa)}.dashboard{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}.account-card{background:var(--cocoa);padding:26px;color:white}.avatar{width:47px;height:47px;border-radius:50%;display:grid;place-items:center;background:#e7c881;color:var(--cocoa);font:24px "Playfair Display",serif;margin-bottom:14px}.account-card h3{font-family:"DM Sans",sans-serif;font-size:15px;margin:0 0 5px;letter-spacing:0}.account-card p{font-size:12px;color:#e7d7c5;margin:0;word-break:break-all}.side-nav{margin-top:20px;display:grid;gap:4px}.side-nav button{display:flex;justify-content:space-between;padding:12px 0;color:#eee1d2;border:0;border-bottom:1px solid rgba(255,255,255,.16);background:none;font-size:12px;text-align:left;cursor:pointer}.side-nav button.active{color:#f2c96d}.side-nav button:last-child{margin-top:8px;border:0;color:#e3af9e}.content-panel{background:var(--white);border:1px solid var(--line);padding:32px;min-height:510px}.content-panel h2{font-size:34px;margin:0 0 7px}.intro{margin:0 0 27px;color:var(--muted);font-size:14px;line-height:1.6}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:25px}.tabs button{padding:0 0 11px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}.tabs button.active{color:var(--cocoa);border-color:var(--gold)}.view{display:none}.view.active{display:block}.empty{padding:48px 12px;text-align:center;color:var(--muted);line-height:1.7}.order{padding:18px 0;border-bottom:1px solid var(--line)}.order:first-child{padding-top:0}.order-top{display:flex;justify-content:space-between;gap:14px;align-items:start}.order h3{font-family:"DM Sans",sans-serif;font-size:14px;margin:0 0 5px;letter-spacing:0}.order-date,.order small{font-size:12px;color:var(--muted)}.status{display:inline-block;padding:6px 9px;background:#f3e7cf;color:#70531e;font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}.status.delivered{background:#dcece2;color:#27613f}.status.shipped{background:#e6edf4;color:#45617a}.order-items{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0 16px}.order-items img{width:55px;height:65px;object-fit:cover}.tracking{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:7px}.track{position:relative;padding-top:24px;font-size:10px;color:#a19283}.track:before{content:"";position:absolute;top:6px;left:0;right:0;height:1px;background:#ddd1c2}.track:first-child:before{left:50%}.track:last-child:before{right:50%}.track:after{content:"";position:absolute;top:1px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#ddd1c2}.track.active{color:var(--cocoa);font-weight:700}.track.active:after{background:var(--gold)}.track.active:before{background:var(--gold)}.address-box{padding:17px;background:#f8f3eb;border-left:3px solid var(--gold);font-size:13px;line-height:1.6}.checkout-summary{margin:24px 0;padding:17px;background:#f8f3eb}.checkout-line{display:flex;justify-content:space-between;gap:13px;padding:8px 0;font-size:13px}.checkout-line.total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-weight:700}.payment-options{display:grid;gap:9px;margin-bottom:20px}.pay-option{display:flex;gap:10px;align-items:center;padding:13px;border:1px solid var(--line);font-size:13px}.pay-option input{accent-color:var(--cocoa)}.notice{padding:12px 14px;margin:17px 0;background:#eee2cf;color:#664c2d;font-size:12px;line-height:1.5}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--cocoa);color:white;padding:13px 18px;box-shadow:var(--shadow);font-size:13px;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}footer{border-top:1px solid var(--line);padding:24px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:720px){.nav{padding:0 17px;height:66px}.nav-links a:not(:last-child){display:none}.page{padding:38px 17px 64px}.dashboard{grid-template-columns:1fr}.account-card{display:grid;grid-template-columns:50px 1fr;column-gap:12px;align-items:center}.avatar{grid-row:span 2;margin:0}.side-nav{grid-column:span 2;grid-template-columns:repeat(3,1fr);gap:10px}.side-nav button{font-size:10px}.content-panel{padding:22px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.tracking{font-size:8px}.order-top{display:block}.status{margin-top:8px}}
  </style>
</head>
<body>
  <div class="announcement">SPARKLYSOUL ACCOUNT · ORDER TRACKING · DELHI, INDIA</div>
  <nav class="nav"><a class="brand" href="index.html"><img src="sparklysoul-logo-transparent.png" alt="SparklySoul logo"><span>SparklySoul</span></a><div class="nav-links"><a href="index.html#new">Shop jewellery</a><a href="index.html#collections">Collections</a><a href="auth.html?next=admin">Store admin</a><a href="index.html">Back to store →</a></div></nav>
  <main class="page" id="app"></main>
  <footer>© 2026 SparklySoul · Your sparkle, managed with care.</footer>
  <div class="toast" id="toast"></div>
  <script>
    const $ = s => document.querySelector(s);
    const money = n => '₹' + Number(n).toLocaleString('en-IN');
    let user=null,firebaseAuth=null,firebaseSignOut=null;
    let cart = JSON.parse(localStorage.getItem('sparklySoulCart') || '[]');
    let orders = JSON.parse(localStorage.getItem('sparklySoulOrders') || '[]');
    const steps = ['Order Confirmed','Packed','Shipped','Out for Delivery','Delivered'];
    function showToast(message){const e=$('#toast');e.textContent=message;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2500)}
    function esc(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    async function bootAccount(){try{const response=await fetch('/api/firebase-config');if(!response.ok)throw new Error('Firebase login is available on the deployed Vercel site.');const config=await response.json();const [{initializeApp},{getAuth,onAuthStateChanged,signOut}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js')]);firebaseAuth=getAuth(initializeApp(config));firebaseSignOut=signOut;const firebaseUser=await new Promise(resolve=>{let unsubscribe;unsubscribe=onAuthStateChanged(firebaseAuth,current=>{if(unsubscribe)unsubscribe();resolve(current)})});if(!firebaseUser){location.replace('auth.html?next=account');return}const saved=JSON.parse(localStorage.getItem('sparklySoulUser')||'null')||{};user={name:firebaseUser.displayName||saved.name||firebaseUser.email.split('@')[0],email:firebaseUser.email,phone:saved.phone||'',address:saved.address||''};localStorage.setItem('sparklySoulUser',JSON.stringify(user));renderDashboard(location.hash==='#checkout'?'checkout':'orders')}catch(error){$('#app').innerHTML=`<div class="empty">${esc(error.message||'Account login could not be loaded.')}<br><br><a class="button" href="auth.html">Go to sign in →</a></div>`}}
    function renderLogin(){location.replace('auth.html?next=account')}
    function login(){location.replace('auth.html?next=account')}
    function renderDashboard(active='orders'){const initial=(user.name||'S').trim().charAt(0).toUpperCase();$('#app').innerHTML=`<div class="eyebrow">My SparklySoul</div><h1>Hello, ${esc(user.name.split(' ')[0])}.</h1><div class="dashboard"><aside class="account-card"><div class="avatar">${initial}</div><div><h3>${esc(user.name)}</h3><p>${esc(user.email)}</p></div><div class="side-nav"><button class="${active==='orders'?'active':''}" onclick="showView('orders')">My orders <span>→</span></button><button class="${active==='profile'?'active':''}" onclick="showView('profile')">Profile & address <span>→</span></button><button class="${active==='checkout'?'active':''}" onclick="showView('checkout')">Checkout <span>→</span></button><button onclick="logout()">Sign out <span>×</span></button></div></aside><section class="content-panel"><div class="tabs"><button class="${active==='orders'?'active':''}" onclick="showView('orders')">Orders & tracking</button><button class="${active==='profile'?'active':''}" onclick="showView('profile')">Profile</button><button class="${active==='checkout'?'active':''}" onclick="showView('checkout')">Checkout</button></div><div class="view ${active==='orders'?'active':''}" id="ordersView"></div><div class="view ${active==='profile'?'active':''}" id="profileView"></div><div class="view ${active==='checkout'?'active':''}" id="checkoutView"></div></section></div>`;renderOrders();renderProfile();renderCheckout()}
    function showView(view){document.querySelectorAll('.view,.tabs button,.side-nav button').forEach(e=>e.classList.remove('active'));$('#'+view+'View').classList.add('active');document.querySelector(`.tabs button[onclick="showView('${view}')"]`).classList.add('active');document.querySelector(`.side-nav button[onclick="showView('${view}')"]`).classList.add('active')}
    function statusClass(s){return s==='Delivered'?'delivered':(s==='Shipped'||s==='Out for Delivery'?'shipped':'')}
    function tracking(status){let pos=steps.indexOf(status);if(pos<0)pos=0;return `<div class="tracking">${steps.slice(0,4).map((s,i)=>`<div class="track ${i<=pos?'active':''}">${s.replace('Order ','')}</div>`).join('')}</div>`}
    function renderOrders(){const my=orders.filter(o=>o.customer.email===user.email);$('#ordersView').innerHTML=`<h2>Orders & tracking</h2><p class="intro">Your order status is updated by our Delhi team as your jewellery makes its way to you.</p>${my.length?my.map(o=>`<article class="order"><div class="order-top"><div><h3>Order #${o.id}</h3><span class="order-date">Placed ${o.placedAt} · ${esc(o.payment)}</span></div><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></div><div class="order-items">${o.items.map(i=>`<img src="${esc(i.image)}" alt="${esc(i.name)}" title="${esc(i.name)} × ${i.qty}">`).join('')}</div><small>${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(' · ')} · <strong>${money(o.total)}</strong></small>${tracking(o.status)}</article>`).join(''):`<div class="empty">No orders yet.<br><br><a class="button" href="index.html#new">Explore jewellery →</a></div>`}`}
    function renderProfile(){$('#profileView').innerHTML=`<h2>Profile & delivery address</h2><p class="intro">Keep these details up to date for a smooth delivery experience.</p><form onsubmit="saveProfile(event)"><div class="form-grid"><div class="field"><label>Full name</label><input name="name" required value="${esc(user.name)}"></div><div class="field"><label>Email address</label><input type="email" name="email" required value="${esc(user.email)}"></div><div class="field full"><label>Phone number</label><input name="phone" required value="${esc(user.phone||'')}"></div><div class="field full"><label>Delivery address</label><textarea name="address" required placeholder="House / flat no., street, locality, Delhi, PIN code">${esc(user.address||'')}</textarea></div></div><button class="button">Save changes →</button></form>`}
    function saveProfile(e){e.preventDefault();const f=new FormData(e.target);user={...user,name:f.get('name'),email:f.get('email'),phone:f.get('phone'),address:f.get('address')};localStorage.setItem('sparklySoulUser',JSON.stringify(user));renderDashboard('profile');showToast('Profile saved')}
    function renderCheckout(){let total=cart.reduce((a,i)=>a+i.price*i.qty,0);$('#checkoutView').innerHTML=`<h2>Secure checkout</h2><p class="intro">Your order will be visible in your profile immediately after it is placed.</p>${cart.length?`<div class="checkout-summary">${cart.map(i=>`<div class="checkout-line"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<div class="checkout-line total"><span>Total</span><span>${money(total)}</span></div></div>${!user.address?'<div class="notice">Please save your delivery address in Profile before placing this order.</div>':''}<form onsubmit="placeOrder(event)"><div class="payment-options"><label class="pay-option"><input type="radio" name="payment" value="UPI · Payment Pending" checked> UPI / QR payment <small>(gateway integration required to go live)</small></label><label class="pay-option"><input type="radio" name="payment" value="Cash on Delivery"> Cash on Delivery</label></div><button class="button" ${!user.address?'disabled':''}>Place order securely →</button></form>`:`<div class="empty">Your bag is empty.<br><br><a class="button" href="index.html#new">Shop now →</a></div>`}`}
    function placeOrder(e){e.preventDefault();if(!user.address)return;const payment=new FormData(e.target).get('payment'),total=cart.reduce((a,i)=>a+i.price*i.qty,0),newOrder={id:'SS'+String(Date.now()).slice(-6),placedAt:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),customer:{...user},items:cart,total,payment,status:'Order Confirmed'};orders.unshift(newOrder);localStorage.setItem('sparklySoulOrders',JSON.stringify(orders));cart=[];localStorage.setItem('sparklySoulCart','[]');renderDashboard('orders');showToast('Order placed! Your tracking is ready.')}
    async function logout(){if(firebaseAuth&&firebaseSignOut)await firebaseSignOut(firebaseAuth);localStorage.removeItem('sparklySoulUser');user=null;location.replace('auth.html')}
    bootAccount();
  </script>
</body>
</html>
